name: Config Validation

'on':
    workflow_dispatch:
    schedule:
        -
            cron: '0 7 * * 1-5'
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    validate:
        runs-on: ubuntu-26.04
        steps:
            -
                uses: actions/checkout@v7.0.1
            -
                uses: actions/setup-node@v7.1.0
                with:
                    node-version: 24.21.0
            -
                run: npx --yes --package renovate -- renovate-config-validator --strict default.json
